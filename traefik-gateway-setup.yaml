# Traefik Gateway API Setup Instructions
# This file provides instructions and resources for setting up Traefik with Gateway API support
# 
# Prerequisites:
# 1. Install Gateway API CRDs (v1.0.0 or later):
#    kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.0.0/standard-install.yaml
#
# 2. Install Traefik using Helm with Gateway API provider enabled:
#    helm repo add traefik https://traefik.github.io/charts
#    helm repo update
#    helm install traefik traefik/traefik \
#      --namespace traefik \
#      --create-namespace \
#      --set ports.web.nodePort=30080 \
#      --set ports.websecure.nodePort=30443 \
#      --set providers.kubernetesGateway.enabled=true
#
# 3. Verify Traefik is running:
#    kubectl get pods -n traefik
#    kubectl get svc -n traefik
#
# 4. Deploy the application:
#    kubectl apply -f aks-store-ingress-quickstart.yaml
#
# 5. Access the application:
#    - Get the external IP of the Gateway:
#      kubectl get gateway store-front-gateway
#    - Access the store-front at http://<GATEWAY_IP>
#
# Note: The aks-store-ingress-quickstart.yaml file now uses Gateway API resources
# (GatewayClass, Gateway, HTTPRoute) instead of the traditional Ingress resource.
